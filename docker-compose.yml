services:
  postgres:
    image: postgres:16-alpine
    container_name: productiondb-postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest
    container_name: productiondb-api
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://appuser:apppass@postgres:5432/appdb
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: appuser
      PGRST_JWT_SECRET: "mysecretpasswordforjwt1234567890ab"
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: productiondb-web
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest
    restart: unless-stopped

volumes:
  pgdata:
