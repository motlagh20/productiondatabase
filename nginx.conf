worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen       80;
        server_name  localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Frontend Static Files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API Proxy to PostgREST
        location /api/ {
            default_type  application/json;
            proxy_pass http://postgrest:3000/;

            # Rewrite RPC calls
            rewrite ^/api/rpc/(.*) /rpc/$1 break;

            # Admin CRUD paths
            rewrite ^/api/admin/shifts(.*) /shifts$1 break;
            rewrite ^/api/admin/fuel-types(.*) /fuel_types$1 break;
            rewrite ^/api/admin/glazes(.*) /glazes$1 break;
            rewrite ^/api/admin/molds(.*) /molds$1 break;
            rewrite ^/api/admin/categories(.*) /categories$1 break;
            rewrite ^/api/admin/products(.*) /products$1 break;
            rewrite ^/api/admin/users(.*) /users$1 break;
            rewrite ^/api/admin/roles(.*) /roles$1 break;

            # Frontend compatibility views
            rewrite ^/api/users(.*) /users$1 break;
            rewrite ^/api/categories(.*) /categories$1 break;
            rewrite ^/api/molds(.*) /molds$1 break;
            rewrite ^/api/glazes(.*) /glazes$1 break;
            rewrite ^/api/products(.*) /products$1 break;
            rewrite ^/api/operators_dryer(.*) /operators_dryer$1 break;
            rewrite ^/api/operators_kiln(.*) /operators_kiln$1 break;
            rewrite ^/api/operators(.*) /operators$1 break;
            rewrite ^/api/dryer_history(.*) /dryer_history$1 break;
            rewrite ^/api/dryer_unload_history(.*) /dryer_unload_history$1 break;
            rewrite ^/api/dryer_chambers_status(.*) /dryer_chambers_status$1 break;
            rewrite ^/api/dryer_readings_recent(.*) /dryer_readings_recent$1 break;

            # Setting endpoints
            rewrite ^/api/setting/transactions(.*) /rpc/get_setting_transactions$1 break;
            rewrite ^/api/setting/batch$ /rpc/create_setting_batch break;
            rewrite ^/api/setting/batch/([0-9]+)/wagons$ /rpc/add_setting_wagons?batch_id=$1 break;
            rewrite ^/api/setting/update$ /rpc/update_setting_transaction break;
            rewrite ^/api/setting/latest(.*) /rpc/get_setting_transactions?per_page=1$1 break;

            # Kiln endpoints
            rewrite ^/api/kiln/push$ /rpc/kiln_push break;
            rewrite ^/api/kiln/pushing/recent(.*) /kiln_pushing_recent$1 break;
            rewrite ^/api/kiln/last-push-info(.*) /kiln_last_push_info$1 break;

            # Dryer endpoints
            rewrite ^/api/dryer/load$ /rpc/create_dryer_loading break;
            rewrite ^/api/dryer/unload$ /rpc/create_dryer_unloading break;
            rewrite ^/api/dryer/unload-and-setting$ /rpc/unload_and_setting break;
            rewrite ^/api/dryer/occupied_details(.*) /dryer_occupied$1 break;
            rewrite ^/api/dryer_occupied(.*) /dryer_occupied$1 break;
            rewrite ^/api/dryer/chambers/status(.*) /dryer_chambers_status$1 break;
            rewrite ^/api/dryer/delete_load$ /rpc/delete_dryer_load break;
            rewrite ^/api/dryer/readings$ /rpc/create_dryer_reading_by_chamber break;

            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
        }
    }
}
